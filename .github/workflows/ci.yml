name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
  AUTH_SECRET: ci-auth-secret-minimum-32-characters-long
  DOWNLOAD_TOKEN_SECRET: ci-download-secret-minimum-32-chars

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm install -g npm@11
          npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit (high+)
        run: npm run audit:check
