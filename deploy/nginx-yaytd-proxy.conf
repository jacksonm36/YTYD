# YAYTD reverse proxy — copy to /etc/nginx/sites-available/yaytd
# Public :3000 (and optional :80) → Next.js on 127.0.0.1:3001
# Requires: libnginx-mod-http-headers-more-filter, server_tokens off in nginx.conf

server {
    listen 3000;
    listen [::]:3000;
    server_name DOMAIN_PLACEHOLDER;

    server_tokens off;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/yaytd-proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN_PLACEHOLDER;

    server_tokens off;
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/yaytd-proxy-headers.conf;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
